ai-core:
  - changed-files:
      - any-glob-to-any-file: ["core.py", "image_generator.py", "llm_memories_manager.py", "memory/**/*"]

automation:
  - changed-files:
      - any-glob-to-any-file: ["app.py", "start_bot.py", "automation/**/*"]

security:
  - changed-files:
      - any-glob-to-any-file: ["security/**/*", "SECURITY.md"]

dashboard:
  - changed-files:
      - any-glob-to-any-file: ["dashboard/**/*"]

tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**/*"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "LICENSE"]

ci-cd:
  - changed-files:
      - any-glob-to-any-file: [".github/**/*", "Dockerfile", "docker-compose.yml", "pyproject.toml"]
